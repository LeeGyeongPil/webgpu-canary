<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webgpu-canary demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1c1f24; }
      main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { margin: 0 0 4px; font-size: 1.5rem; }
      .sub { color: #555; margin: 0 0 16px; }
      .notice { background: #fff7e0; border: 1px solid #e6c667; padding: 10px 12px; border-radius: 6px; margin: 12px 0; }
      .card { background: #fff; border: 1px solid #dde1e6; border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
      table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eceff3; vertical-align: top; }
      .pass { color: #0a7a33; font-weight: 600; } .error, .timeout, .numeric, .mismatch { color: #b3261e; font-weight: 600; } .skipped { color: #777; }
      button { padding: 6px 12px; margin-right: 8px; cursor: pointer; }
      label { display: block; margin: 4px 0; }
      .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
