# No keys and no model downloads: the tests and the mock example run offline (Node.js, TypeScript, React).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catch breakage from new dependency or runtime versions
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run example:mock
      - run: node scripts/check-package.mjs
      - run: npm run demo:build
